<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#2c5a3c">
<title>Grand Jeu Fanar</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;800&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #f3eddf;
    --card: #fffdf7;
    --ink: #23301f;
    --muted: #6d7062;
    --line: #e2d9c4;
    --forest: #2c5a3c;
    --ok: #23804c;
    --ok-bg: #e2f2e7;
    --no: #b83a2c;
    --no-bg: #fbe4df;
    --todo: #8a7a4f;
    --todo-bg: #f1ead7;
    --accent: var(--forest);
    --radius: 16px;
  }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font: 16px/1.45 Nunito, system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  h1, h2, .display { font-family: "Baloo 2", Nunito, system-ui, sans-serif; line-height: 1.1; }
  button { font: inherit; color: inherit; cursor: pointer; }
  button, a { touch-action: manipulation; -webkit-tap-highlight-color: transparent; }
  button, .ghost { min-height: 44px; }
  a:focus-visible, button:focus-visible, summary:focus-visible { outline: 3px solid #e0a526; outline-offset: 3px; }
  .wrap { max-width: 720px; margin: 0 auto; padding: max(16px, env(safe-area-inset-top)) max(16px, env(safe-area-inset-right)) max(40px, env(safe-area-inset-bottom)) max(16px, env(safe-area-inset-left)); }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); }

  /* ---------- Login ---------- */
  .login { min-height: 100vh; display: grid; place-items: center; padding: 24px 16px; }
  .login, .loading { min-height: 100svh; }
  .login .card { width: 100%; max-width: 380px; padding: 28px 24px 24px; text-align: center; }
  .crest { font-size: 44px; line-height: 1; }
  .login h1 { margin: 10px 0 4px; font-size: 32px; color: var(--forest); }
  .login p { margin: 0 0 22px; color: var(--muted); }
  .field { display: block; text-align: left; margin-bottom: 14px; font-weight: 700; font-size: 14px; }
  .field input {
    display: block; width: 100%; margin-top: 6px; padding: 12px 14px;
    font: inherit; font-weight: 400; font-size: 16px; color: var(--ink);
    background: #fff; border: 1.5px solid var(--line); border-radius: 12px; outline: none;
  }
  .field input:focus { border-color: var(--forest); box-shadow: 0 0 0 3px rgba(44, 90, 60, .15); }
  .btn {
    display: inline-flex; align-items: center; justify-content: center; gap: 8px;
    width: 100%; padding: 13px 16px; border: 0; border-radius: 12px;
    background: var(--forest); color: #fff; font-weight: 800; font-size: 16px;
  }
  .btn:disabled { opacity: .6; cursor: default; }
  .error { margin: 14px 0 0; color: var(--no); font-weight: 700; font-size: 14px; min-height: 1em; }

  /* ---------- Top bar ---------- */
  .top {
    display: flex; align-items: center; justify-content: space-between; gap: 12px;
    padding: 14px 16px; border-radius: var(--radius); background: var(--accent); color: #fff;
  }
  .brand { display: flex; align-items: center; gap: 12px; min-width: 0; }
  .brand > div { min-width: 0; }
  .brand .emoji {
    flex: none; width: 52px; height: 52px; display: grid; place-items: center;
    font-size: 30px; background: rgba(255, 255, 255, .18); border-radius: 14px;
  }
  .brand small { display: block; font-weight: 700; opacity: .85; font-size: 13px; text-transform: uppercase; letter-spacing: .06em; }
  .brand h1 { margin: 0; font-size: 28px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .ghost {
    flex: none; border: 1.5px solid rgba(255, 255, 255, .55); background: transparent; color: #fff;
    border-radius: 10px; padding: 8px 12px; font-weight: 700; font-size: 14px;
  }
  .top-actions { display: flex; gap: 8px; flex-wrap: wrap; justify-content: flex-end; }
  a.ghost { text-decoration: none; }

  /* ---------- Location card ---------- */
  .lieu { margin-top: 14px; padding: 20px; text-align: center; position: relative; overflow: hidden; }
  .lieu .kicker { font-weight: 800; font-size: 13px; text-transform: uppercase; letter-spacing: .08em; color: var(--accent); }
  .lieu .name { font-size: clamp(28px, 8vw, 40px); margin: 6px 0 4px; color: var(--ink); overflow-wrap: anywhere; }
  .lieu.locked .name { color: var(--muted); }
  .lieu .hint { color: var(--muted); margin: 0; }
  .bar { height: 10px; border-radius: 99px; background: var(--todo-bg); margin: 14px 0 8px; overflow: hidden; }
  .bar span { display: block; height: 100%; border-radius: inherit; background: var(--accent); transition: width .5s ease; }
  .previous { margin: 14px 0 0; padding-top: 12px; border-top: 1px dashed var(--line); color: var(--muted); font-size: 14px; }
  .previous b { color: var(--ink); }
  .lieu.unlocked { border: 2px solid var(--accent); }
  .location-image { display: block; width: 100%; margin: 0; border-radius: 12px; overflow: hidden; background: #fff; }
  .location-image img { display: block; width: 100%; aspect-ratio: 1; max-height: 55svh; object-fit: contain; }
  .image-error { display: block; padding: 16px; color: var(--muted); font-size: 15px; }
  .previous summary { cursor: pointer; min-height: 44px; padding: 10px 0; font-weight: 800; color: var(--ink); }
  .previous-location { padding-top: 10px; }
  .progress-count { display: flex; align-items: center; justify-content: center; gap: 8px; margin: 12px 0 0; color: var(--muted); font-weight: 800; font-variant-numeric: tabular-nums; }
  .connection { color: #ffd781; margin-left: 6px; }
  [hidden] { display: none !important; }

  /* ---------- Stats & lists ---------- */
  .stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-top: 14px; }
  .stat { padding: 12px 8px; text-align: center; border-radius: 14px; }
  .stat b { display: block; font-family: "Baloo 2", Nunito, sans-serif; font-size: 30px; line-height: 1; }
  .stat span { font-size: 13px; font-weight: 700; }
  .stat.todo { background: var(--todo-bg); color: var(--todo); }
  .stat.no { background: var(--no-bg); color: var(--no); }
  .stat.ok { background: var(--ok-bg); color: var(--ok); }

  .group { margin-top: 22px; }
  .group h2 { display: flex; align-items: center; gap: 8px; margin: 0 0 8px; font-size: 22px; }
  .group h2 .count { font-family: Nunito, sans-serif; font-size: 13px; font-weight: 800; padding: 2px 9px; border-radius: 99px; }
  .group.todo h2 .count { background: var(--todo-bg); color: var(--todo); }
  .group.no h2 .count { background: var(--no-bg); color: var(--no); }
  .group.ok h2 .count { background: var(--ok-bg); color: var(--ok); }
  .list { list-style: none; margin: 0; padding: 0; }
  .item {
    display: flex; align-items: flex-start; gap: 12px; padding: 12px 14px; margin-bottom: 8px;
    background: var(--card); border: 1px solid var(--line); border-radius: 12px; font-weight: 600;
  }
  .item .mark {
    flex: none; width: 26px; height: 26px; display: grid; place-items: center;
    border-radius: 50%; font-size: 14px; font-weight: 800;
  }
  .item.todo .mark { border: 2px solid var(--line); }
  .item.ok .mark { background: var(--ok); color: #fff; }
  .item.no .mark { background: var(--no); color: #fff; }
  .item.ok .label { color: var(--muted); }
  .item.no .label { color: var(--no); }
  .item .label { min-width: 0; padding-top: 2px; overflow-wrap: anywhere; }
  .label { white-space: pre-line; }
  .challenge-link { color: var(--accent); text-decoration: underline; text-underline-offset: 3px; overflow-wrap: anywhere; }
  .empty { color: var(--muted); font-style: italic; margin: 0; padding: 4px 2px; }
  .foot { margin-top: 26px; text-align: center; color: var(--muted); font-size: 13px; }
  .foot .offline { color: var(--no); font-weight: 700; }

  /* ---------- Admin ---------- */
  .tabs { display: flex; gap: 8px; margin-top: 14px; overflow-x: auto; padding-bottom: 4px; scrollbar-width: none; }
  .tabs::-webkit-scrollbar { display: none; }
  .tab {
    flex: none; display: flex; align-items: center; gap: 6px; padding: 9px 14px;
    background: var(--card); border: 1.5px solid var(--line); border-radius: 99px; font-weight: 800; font-size: 15px;
  }
  .tab small { font-weight: 700; color: var(--muted); font-size: 12px; }
  .tab[aria-selected="true"] { background: var(--tab-color); border-color: var(--tab-color); color: #fff; }
  .tab[aria-selected="true"] small { color: rgba(255, 255, 255, .85); }
  .panel-head { display: flex; align-items: center; gap: 12px; margin-top: 18px; }
  .panel-head .emoji { font-size: 34px; }
  .panel-head h2 { margin: 0; font-size: 30px; color: var(--accent); }
  .lieux-admin { margin-top: 12px; padding: 14px 16px; }
  .lieux-admin h3 { margin: 0 0 8px; font-size: 14px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); }
  .lieu-row { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 7px 0; border-top: 1px dashed var(--line); }
  .lieu-row:first-of-type { border-top: 0; }
  .lieu-row .who { flex: 1; min-width: 0; overflow-wrap: anywhere; }
  .lieu-row .who small { display: block; color: var(--muted); font-weight: 700; font-size: 12px; }
  .badge { flex: none; font-size: 12px; font-weight: 800; padding: 3px 10px; border-radius: 99px; }
  .badge.on { background: var(--ok-bg); color: var(--ok); }
  .badge.off { background: var(--todo-bg); color: var(--todo); }
  .admin-item { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 10px; padding: 12px 14px; margin-bottom: 8px; background: var(--card); border: 1px solid var(--line); border-radius: 12px; }
  .admin-item .label { font-weight: 700; flex: 1 1 220px; overflow-wrap: anywhere; }
  .admin-item.saving { opacity: .65; }
  .seg { display: inline-flex; flex: none; border: 1.5px solid var(--line); border-radius: 10px; overflow: hidden; background: #fff; }
  .seg button { border: 0; background: transparent; padding: 8px 12px; font-weight: 800; font-size: 14px; color: var(--muted); }
  .seg button + button { border-left: 1.5px solid var(--line); }
  .seg button[aria-pressed="true"].todo { background: var(--todo-bg); color: var(--todo); }
  .seg button[aria-pressed="true"].ok { background: var(--ok); color: #fff; }
  .seg button[aria-pressed="true"].no { background: var(--no); color: #fff; }
  .seg button:focus-visible, .tab:focus-visible, .btn:focus-visible, .ghost:focus-visible { outline: 3px solid #e0a526; outline-offset: 2px; }

  /* ---------- Errors ---------- */
  .toast {
    position: fixed; left: 50%; bottom: 20px; transform: translateX(-50%); z-index: 20;
    max-width: calc(100% - 32px); padding: 12px 16px; border-radius: 12px;
    background: var(--ink); color: #fff; font-weight: 700; box-shadow: 0 6px 24px rgba(0, 0, 0, .25);
  }
  .loading { min-height: 100vh; min-height: 100svh; display: grid; place-items: center; color: var(--muted); font-weight: 700; }
  @media (max-width: 520px) {
    .top { flex-wrap: wrap; padding: 12px; }
    .brand { flex: 1 1 160px; gap: 10px; }
    .brand .emoji { width: 44px; height: 44px; font-size: 26px; }
    .brand h1 { font-size: 24px; }
    .top-actions { width: 100%; }
    .top-actions .ghost { flex: 1; text-align: center; }
    .ghost { padding: 10px; font-size: 13px; }
    .lieu { padding: 16px; }
    .stats { gap: 8px; }
    .stat { padding: 10px 4px; }
    .tabs { scroll-snap-type: x proximity; }
    .tab { min-height: 48px; scroll-snap-align: start; }
    .admin-item { align-items: stretch; padding: 12px; }
    .admin-item .label { flex-basis: 100%; }
    .seg { display: flex; width: 100%; }
    .seg button { flex: 1; min-width: 0; min-height: 48px; padding: 10px 5px; }
    .lieu-row { flex-wrap: wrap; align-items: flex-start; }
    .item { gap: 10px; padding: 12px; }
    .login { padding: max(20px, env(safe-area-inset-top)) 16px max(20px, env(safe-area-inset-bottom)); }
    .login .card { padding: 24px 20px 16px; }
  }
  @media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }
</style>
</head>
<body>
<div id="app"><div class="loading">Chargement…</div></div>
<script>
  const THEMES = {
    requin: { emoji: '🦈', color: '#1f6aa0' },
    faucon: { emoji: '🦅', color: '#a65a1c' },
    bison: { emoji: '🦬', color: '#74472c' },
    leops: { emoji: '🐆', color: '#b07a00' },
    panda: { emoji: '🐼', color: '#383838' },
  };
  const ADMIN_THEME = { emoji: '⚜️', color: '#2c5a3c' };
  const REFRESH_MS = { patrol: 15000, admin: 20000 };
  const SESSION_EXPIRED = /reconnectez-vous/i;

  const app = document.getElementById('app');

  // localStorage can be unavailable inside the Apps Script iframe; the site still works without it.
  const store = {
    get(key) { try { return JSON.parse(localStorage.getItem('gjf:' + key)); } catch (e) { return null; } },
    set(key, value) { try { localStorage.setItem('gjf:' + key, JSON.stringify(value)); } catch (e) {} },
    remove(key) { try { localStorage.removeItem('gjf:' + key); } catch (e) {} },
  };

  // Remove location names saved by older versions of this website.
  if (store.get('riddleVersion') !== 1) {
    Object.keys(THEMES).forEach(key => store.remove('seen:' + key));
    store.set('riddleVersion', 1);
  }

  const state = {
    token: store.get('token'),
    data: null,
    tab: store.get('tab'),
    pending: {},     // "patrolKey:row" -> { status, seq } for admin writes not yet confirmed
    writeSeq: 0,
    refreshing: false,
    offline: false,
    timer: null,
  };

  // Served by Apps Script, the page talks to Code.gs through google.script.run.
  // Served anywhere else (GitHub Pages), it calls the same functions through doPost at this URL.
  const API_URL = 'https://script.google.com/macros/s/AKfycbydBBjl4ybhr6kdlqfCgXGZra0qoxWp8DaQfiOTKymGrBpV1eKAPIGXIffPfEfJPPFx/exec';

  function call(fn, ...args) {
    if (!(window.google && google.script && google.script.run)) return callApi(fn, args);
    return new Promise((resolve, reject) => {
      google.script.run
        .withSuccessHandler(resolve)
        .withFailureHandler(err => {
          const msg = String((err && err.message) || err || 'Erreur inconnue');
          reject(new Error(msg.replace(/^(Error|Exception|ScriptError):\s*/i, '')));
        })[fn](...args);
    });
  }

  async function callApi(fn, args) {
    let res;
    const controller = new AbortController();
    const timeout = setTimeout(() => controller.abort(), 25000);
    try {
      // text/plain keeps this a "simple" request, which Apps Script accepts from other sites.
      res = await fetch(API_URL, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify({ fn, args }), signal: controller.signal });
    } catch (e) {
      throw new Error('Impossible de joindre le serveur. Vérifiez la connexion internet, puis réessayez.');
    } finally {
      clearTimeout(timeout);
    }
    let body;
    try { body = await res.json(); } catch (e) {
      throw new Error('Le serveur Google a renvoyé une réponse inattendue. Le déploiement Apps Script doit être accessible à « Tout le monde ».');
    }
    if (!body.ok) throw new Error(body.error);
    return body.value;
  }

  const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const theme = key => THEMES[key] || ADMIN_THEME;

  // Only URLs become markup. All Sheet text and attributes stay HTML-escaped.
  function challengeText(value) {
    const text = String(value);
    const urls = /(?:https?:\/\/|www\.)[^\s<>"']+/gi;
    let html = '', start = 0;
    for (const match of text.matchAll(urls)) {
      let url = match[0].replace(/[.,;:!?]+$/, '');
      // Keep balanced parentheses in URLs, but leave sentence punctuation outside.
      while (url.endsWith(')') && (url.match(/\)/g) || []).length > (url.match(/\(/g) || []).length) url = url.slice(0, -1);
      const href = /^www\./i.test(url) ? 'https://' + url : url;
      html += esc(text.slice(start, match.index));
      try {
        const parsed = new URL(href);
        if (!['https:', 'http:'].includes(parsed.protocol)) throw new Error('Unsupported URL');
        html += `<a class="challenge-link" href="${esc(parsed.href)}" target="_blank" rel="noopener noreferrer">${esc(url)}</a>`;
      } catch (e) { html += esc(url); }
      start = match.index + url.length;
    }
    return html + esc(text.slice(start));
  }

  function locationImageUrl(location) {
    // The server sends only authorized image bytes, with no filename or public URL.
    const source = location.imageData;
    return typeof source === 'string' && /^data:image\/(?:png|jpeg|webp);base64,[A-Za-z0-9+/]+=*$/.test(source) ? source : '';
  }

  function locationContent(location) {
    const src = locationImageUrl(location);
    const label = state.data && state.data.role === 'admin'
      ? `<div class="name display">${esc(location.name || '')}</div>` : '';
    if (!src) return `${label}<p class="image-error">Image indisponible</p>`;
    return `${label}<div class="location-image"><img src="${esc(src)}" alt="Indice" decoding="async"></div>`;
  }

  // Keep existing rows, images, focus and open details during background updates.
  function nodeKey(node) {
    return node.nodeType === Node.ELEMENT_NODE ? node.getAttribute('data-ui-key') : null;
  }

  function patchNode(current, next) {
    if (current.nodeType !== Node.ELEMENT_NODE) {
      if (current.nodeValue !== next.nodeValue) current.nodeValue = next.nodeValue;
      return;
    }
    for (const attr of [...current.attributes]) {
      if (current.tagName === 'DETAILS' && attr.name === 'open') continue;
      if (!next.hasAttribute(attr.name)) current.removeAttribute(attr.name);
    }
    for (const attr of next.attributes) {
      if (current.getAttribute(attr.name) !== attr.value) current.setAttribute(attr.name, attr.value);
    }
    patchChildren(current, next);
  }

  function patchChildren(current, next) {
    const keyed = new Map([...current.childNodes].filter(nodeKey).map(node => [nodeKey(node), node]));
    let cursor = current.firstChild;
    for (const child of [...next.childNodes]) {
      const key = nodeKey(child);
      let existing = key ? keyed.get(key) : cursor;
      if (!existing || existing.nodeType !== child.nodeType || existing.nodeName !== child.nodeName || nodeKey(existing) !== key) {
        existing = child.cloneNode(true);
      }
      if (existing !== cursor) current.insertBefore(existing, cursor);
      patchNode(existing, child);
      cursor = existing.nextSibling;
    }
    while (cursor) {
      const nextSibling = cursor.nextSibling;
      current.removeChild(cursor);
      cursor = nextSibling;
    }
  }

  let renderedMarkup = null;
  function replaceApp(html) {
    renderedMarkup = null;
    app.innerHTML = html;
  }

  function updateApp(html) {
    if (html === renderedMarkup) { syncConnection(); return; }
    const anchor = window.scrollY > 0 && [...app.querySelectorAll('[data-challenge-row]')].find(el => {
      const rect = el.getBoundingClientRect();
      return rect.bottom > 0 && rect.top < window.innerHeight;
    });
    const anchorTop = anchor && anchor.getBoundingClientRect().top;
    const template = document.createElement('template');
    template.innerHTML = html;
    patchChildren(app, template.content);
    renderedMarkup = html;
    if (anchor && anchor.isConnected) {
      const delta = anchor.getBoundingClientRect().top - anchorTop;
      if (Math.abs(delta) > 1) window.scrollBy({ top: delta, behavior: 'instant' });
    }
    syncConnection();
  }

  function syncConnection() {
    const indicator = app.querySelector('[data-offline]');
    if (indicator && indicator.hidden !== !state.offline) indicator.hidden = !state.offline;
  }

  // Counts, unlocked locations and progress for one patrol, including admin edits still in flight.
  function summarize(p) {
    const challenges = p.challenges.map(c => {
      const pending = state.pending[p.key + ':' + c.row];
      return pending ? Object.assign({}, c, { status: pending.status, saving: true }) : c;
    });
    const by = status => challenges.filter(c => c.status === status);
    const accepted = by('accepted').length;
    let unlocked = p.locations;
    let next = p.nextThreshold;
    if (state.data.role === 'admin') {
      unlocked = p.locations.filter(l => l.threshold <= accepted);
      const n = p.locations.find(l => l.threshold > accepted);
      next = n ? n.threshold : null;
    }
    const prev = unlocked.length ? unlocked[unlocked.length - 1].threshold : 0;
    return {
      p, challenges, accepted, unlocked, next,
      todo: by('pending'), rejected: by('rejected'), done: by('accepted'),
      progress: next ? Math.max(0, Math.min(1, (accepted - prev) / (next - prev))) : 1,
    };
  }

  // ---------- Rendering ----------

  function render() {
    if (!state.token) return renderLogin();
    if (!state.data) { replaceApp('<div class="loading">Chargement…</div>'); return; }
    if (state.data.role === 'admin') renderAdmin(); else renderPatrol();
  }

  function renderLogin(message) {
    stopRefresh();
    replaceApp(`
      <main class="login">
        <form class="card" id="login-form" autocomplete="on">
          <div class="crest">⚜️</div>
          <h1>Grand Jeu Fanar</h1>
          <label class="field">Identifiant
            <input id="user" name="username" autocomplete="username" autocapitalize="none" autocorrect="off" spellcheck="false" required>
          </label>
          <label class="field">Mot de passe
            <input id="pass" name="password" type="password" autocomplete="current-password" required>
          </label>
          <button class="btn" id="login-btn" type="submit">Se connecter</button>
          <p class="error" id="login-error" role="alert">${message ? esc(message) : ''}</p>
        </form>
      </main>`);
    // Avoid opening the phone keyboard before the player chooses a field.
    if (window.matchMedia('(pointer: fine)').matches) document.getElementById('user').focus();
  }

  function locationCard(s) {
    if (!s.unlocked.length && !s.next) return '';
    const latest = s.unlocked[s.unlocked.length - 1];
    const earlier = s.unlocked.slice(0, -1).reverse();
    return `
      <section class="card lieu ${latest ? 'unlocked' : 'locked'}" data-ui-key="location">
        ${latest ? `<div data-ui-key="latest-image">${locationContent(latest)}</div>` : ''}
        <div class="progress-count" data-ui-key="progress" aria-label="Défis validés${s.next ? ' / prochain seuil' : ''}">
          <span aria-hidden="true">${latest ? '✓' : '🔒'}</span> ${s.accepted}${s.next ? ' / ' + s.next : ''}
        </div>
        ${earlier.length ? `<details class="previous" data-ui-key="previous"><summary aria-label="Images précédentes">◷ ${earlier.length}</summary>${earlier.map(l => `<div class="previous-location" data-ui-key="location:${l.threshold}">${locationContent(l)}</div>`).join('')}</details>` : ''}
      </section>`;
  }

  function renderPatrol() {
    const s = summarize(state.data.patrol);
    const t = theme(s.p.key);
    document.documentElement.style.setProperty('--accent', t.color);
    updateApp(`
      <div class="wrap" data-ui-key="patrol:${s.p.key}">
        <header class="top" data-ui-key="header">
          <div class="brand"><span class="emoji">${t.emoji}</span>
            <div><h1>${esc(s.p.name)}</h1></div>
            <span class="connection" data-offline hidden role="status" aria-label="Hors ligne" title="Hors ligne">●</span></div>
          <button class="ghost" data-action="logout">Déconnexion</button>
        </header>
        ${locationCard(s)}
        <section class="group" data-ui-key="challenges">
          <ul class="list">${s.challenges.map(c => {
            const cls = c.status === 'accepted' ? 'ok' : c.status === 'rejected' ? 'no' : 'todo';
            const mark = c.status === 'accepted' ? '✓' : c.status === 'rejected' ? '✕' : '';
            return `<li class="item ${cls}" data-ui-key="challenge:${c.row}" data-challenge-row="${c.row}">
              <span class="mark" role="img" aria-label="${c.status === 'accepted' ? 'Validé' : c.status === 'rejected' ? 'Refusé' : 'À faire'}">${mark}</span>
              <span class="label">${challengeText(c.name)}</span></li>`;
          }).join('')}</ul>
        </section>
      </div>`);
  }

  function renderAdmin() {
    const patrols = state.data.patrols;
    if (!patrols.some(p => p.key === state.tab)) state.tab = patrols[0].key;
    const s = summarize(patrols.find(p => p.key === state.tab));
    const t = theme(s.p.key);
    document.documentElement.style.setProperty('--accent', ADMIN_THEME.color);
    updateApp(`
      <div class="wrap" data-ui-key="admin">
        <header class="top" data-ui-key="header">
          <div class="brand"><span class="emoji">${ADMIN_THEME.emoji}</span>
            <div><h1>${esc(state.data.user)}</h1></div>
            <span class="connection" data-offline hidden role="status" aria-label="Hors ligne" title="Hors ligne">●</span></div>
          <div class="top-actions">
            ${state.data.sheetUrl ? `<a class="ghost" href="${esc(state.data.sheetUrl)}" target="_blank" rel="noopener">Feuille</a>` : ''}
            <button class="ghost" data-action="logout">Déconnexion</button>
          </div>
        </header>
        <nav class="tabs" role="tablist" aria-label="Patrouilles" data-ui-key="tabs">
          ${patrols.map(p => {
            const ps = summarize(p);
            return `<button class="tab" role="tab" data-action="tab" data-key="${p.key}" data-ui-key="tab:${p.key}"
                      aria-selected="${p.key === state.tab}" style="--tab-color:${theme(p.key).color}">
                      <span>${theme(p.key).emoji}</span>${esc(p.name)} <small>${ps.accepted}/${p.challenges.length}</small></button>`;
          }).join('')}
        </nav>
        <div style="--accent:${t.color}" data-ui-key="panel:${s.p.key}">
          <div class="panel-head"><span class="emoji">${t.emoji}</span><h2>${esc(s.p.name)}</h2></div>
          <div class="stats">
            <div class="stat todo"><b>${s.todo.length}</b><span>À faire</span></div>
            <div class="stat no"><b>${s.rejected.length}</b><span>Refusés</span></div>
            <div class="stat ok"><b>${s.done.length}</b><span>Validés</span></div>
          </div>
          <section class="card lieux-admin">
            ${s.p.locations.length ? s.p.locations.map(l => {
              const on = l.threshold <= s.accepted;
              return `<div class="lieu-row" data-ui-key="location:${l.threshold}"><div class="who"><small>✓ ${l.threshold}</small>${locationContent(l)}</div>
                      <span class="badge ${on ? 'on' : 'off'}" aria-label="${on ? 'Débloqué' : 'Verrouillé'}">${on ? '✓' : '🔒'}</span></div>`;
            }).join('') : ''}
          </section>
          <section class="group">
            <h2>Défis</h2>
            ${s.challenges.length ? `<ul class="list">${s.challenges.map(c => `
              <li class="admin-item${c.saving ? ' saving' : ''}" data-ui-key="challenge:${c.row}" data-challenge-row="${c.row}">
                <span class="label">${challengeText(c.name)}</span>
                <span class="seg" role="group" aria-label="Statut de ${esc(c.name)}">
                  ${segButton(s.p.key, c, 'pending', 'todo', 'À faire')}
                  ${segButton(s.p.key, c, 'accepted', 'ok', '✓ Valider')}
                  ${segButton(s.p.key, c, 'rejected', 'no', '✕ Refuser')}
                </span>
              </li>`).join('')}</ul>` : ''}
          </section>
        </div>
      </div>`);
  }

  function segButton(patrolKey, c, status, cls, label) {
    return `<button class="${cls}" data-action="status" data-patrol="${patrolKey}" data-row="${c.row}" data-status="${status}"
              aria-pressed="${c.status === status}"${c.saving ? ' disabled' : ''}>${label}</button>`;
  }

  function toast(message) {
    const el = document.createElement('div');
    el.className = 'toast';
    el.setAttribute('role', 'alert');
    el.textContent = message;
    document.body.appendChild(el);
    setTimeout(() => el.remove(), 4500);
  }

  // ---------- Data ----------

  function setData(data) {
    if (data.riddleVersion !== 1) {
      throw new Error('Le serveur doit être mis à jour pour afficher les images sans révéler les réponses. Contactez la maîtrise.');
    }
    if (data.role !== 'admin' && (!data.patrol || !Array.isArray(data.patrol.locations) || data.patrol.locations.some(l =>
      Object.keys(l).some(key => !['threshold', 'imageData'].includes(key))))) {
      throw new Error('Réponse du serveur incompatible avec le mode énigme. Contactez la maîtrise.');
    }
    state.data = data;
    state.offline = false;
    render();
  }

  function handleError(err) {
    if (SESSION_EXPIRED.test(err.message)) return logout(err.message);
    toast(err.message);
  }

  async function refresh() {
    if (!state.token || state.refreshing || document.hidden) return;
    state.refreshing = true;
    const token = state.token;
    const seq = state.writeSeq;
    try {
      const data = await call('getData', token);
      // Drop the result if an admin edit started meanwhile: it may predate that edit.
      if (state.token === token && seq === state.writeSeq && !Object.keys(state.pending).length) setData(data);
    } catch (err) {
      if (state.token !== token) return;
      if (SESSION_EXPIRED.test(err.message)) logout(err.message);
      else if (state.data) { state.offline = true; syncConnection(); }
      else toast(err.message);
    } finally {
      state.refreshing = false;
    }
  }

  function startRefresh() {
    stopRefresh();
    state.timer = setInterval(refresh, REFRESH_MS[state.data && state.data.role] || REFRESH_MS.patrol);
  }

  function stopRefresh() {
    clearInterval(state.timer);
    state.timer = null;
  }

  async function setStatus(patrolKey, row, status) {
    const token = state.token;
    const patrol = state.data.patrols.find(p => p.key === patrolKey);
    const challenge = patrol.challenges.find(c => c.row === row);
    const key = patrolKey + ':' + row;
    const seq = ++state.writeSeq;
    state.pending[key] = { status, seq };
    render();
    try {
      const data = await call('setStatus', token, patrolKey, row, challenge.name, status);
      if (state.token !== token || !state.pending[key] || state.pending[key].seq !== seq) return;
      delete state.pending[key];
      if (seq === state.writeSeq) setData(data);
      else {
        // A slower, older save must not revert newer edits elsewhere in the list.
        const savedPatrol = data.patrols.find(p => p.key === patrolKey);
        const saved = savedPatrol && savedPatrol.challenges.find(c => c.row === row);
        if (saved) challenge.status = saved.status;
        // The current data object may have been replaced by a newer response.
        const currentPatrol = state.data.patrols.find(p => p.key === patrolKey);
        const current = currentPatrol && currentPatrol.challenges.find(c => c.row === row);
        if (saved && current) current.status = saved.status;
        render();
      }
    } catch (err) {
      if (state.token !== token || !state.pending[key] || state.pending[key].seq !== seq) return;
      delete state.pending[key];
      render();
      handleError(err);
    }
  }

  async function login(form) {
    const btn = document.getElementById('login-btn');
    const error = document.getElementById('login-error');
    btn.disabled = true;
    btn.textContent = 'Connexion…';
    error.textContent = '';
    try {
      const res = await call('login', form.username.value, form.password.value);
      state.token = res.token;
      store.set('token', res.token);
      setData(res.data);
      startRefresh();
    } catch (err) {
      btn.disabled = false;
      btn.textContent = 'Se connecter';
      error.textContent = err.message;
    }
  }

  function logout(message) {
    state.token = null;
    state.data = null;
    state.pending = {};
    store.remove('token');
    document.documentElement.style.removeProperty('--accent');
    renderLogin(typeof message === 'string' ? message : '');
  }

  // ---------- Events ----------

  app.addEventListener('submit', e => {
    if (e.target.id === 'login-form') { e.preventDefault(); login(e.target); }
  });

  document.addEventListener('click', e => {
    const el = e.target.closest('[data-action]');
    if (!el) return;
    const action = el.dataset.action;
    if (action === 'logout') logout();
    else if (action === 'retry') loadInitial();
    else if (action === 'tab') { state.tab = el.dataset.key; store.set('tab', state.tab); render(); }
    else if (action === 'status' && el.getAttribute('aria-pressed') !== 'true') {
      setStatus(el.dataset.patrol, Number(el.dataset.row), el.dataset.status);
    }
  });

  document.addEventListener('error', e => {
    if (!(e.target instanceof HTMLImageElement)) return;
    const message = document.createElement('span');
    message.className = 'image-error';
    message.textContent = 'Image indisponible';
    e.target.replaceWith(message);
  }, true);

  document.addEventListener('visibilitychange', () => { if (!document.hidden) refresh(); });

  async function loadInitial() {
    replaceApp('<div class="loading">Chargement…</div>');
    const token = state.token;
    try {
      const data = await call('getData', token);
      if (state.token !== token) return;
      setData(data);
      startRefresh();
    } catch (err) {
      if (state.token !== token) return;
      if (SESSION_EXPIRED.test(err.message)) return logout(err.message);
      replaceApp(`
        <main class="login"><div class="card">
          <div class="crest">⚠️</div>
          <p class="error">${esc(err.message)}</p>
          <p></p>
          <button class="btn" data-action="retry">Réessayer</button>
        </div></main>`);
    }
  }

  if (state.token) loadInitial(); else renderLogin();
</script>
</body>
</html>
